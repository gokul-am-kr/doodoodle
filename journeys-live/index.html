<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>doodoodle journeys</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Caveat:wght@500;700&display=swap');
:root{--ink:#303a35;--paper:#fbf7ec;--peach:#e7a88e}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'DM Sans',sans-serif;background:linear-gradient(125deg,#f6f1e7,#fdf9ee)}header{display:flex;align-items:center;justify-content:space-between;padding:18px min(6vw,80px);border-bottom:1px solid #dfd9ce}header b{font-size:20px;letter-spacing:-1px}.logo{display:inline-flex;align-items:center;justify-content:center;background:#db896c;color:white;border-radius:14px;width:38px;height:38px;margin-right:12px;transform:rotate(-8deg)}.pill{border-radius:30px;padding:12px 18px;background:white;border:1px solid #dcd7cc;cursor:pointer;color:#34423a;font-weight:700}.primary{background:#d97d62;color:white;border-color:#d97d62}.wrap{max-width:1300px;margin:auto;padding:28px 26px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:36px}h1,h2{font-family:'DM Serif Display',serif;font-weight:400}h1{font-size:42px;margin:10px 0}p{line-height:1.65;color:#707970}.eyebrow{font-size:12px;letter-spacing:2px;color:#aa7965;font-weight:700;text-transform:uppercase}.panel{background:#fffcf5;border:1px solid #e5dfd3;border-radius:23px;padding:24px;box-shadow:0 8px 35px #524d3d0a}label{font-size:12px;font-weight:700;display:block;margin:17px 0 6px;color:#74796f}input,textarea,select{width:100%;background:white;border:1px solid #dedbd2;border-radius:11px;padding:12px 14px;color:#354037;font:inherit}textarea{min-height:75px;resize:vertical}input[type=file]{display:none}.upload{display:block;border:2px dashed #d6c7b6;border-radius:15px;padding:22px;text-align:center;background:#fcf4e9;color:#a16d53;cursor:pointer;font-weight:700}.upload small{display:block;font-weight:400;margin-top:7px}.stage{text-align:center;min-width:0}.stage .intro{margin:0 0 22px}.book{background:#e9e0d3;padding:22px;border-radius:22px;box-shadow:0 20px 48px #594f3c25;min-height:450px;display:flex;justify-content:center;align-items:center}.page{width:min(100%,720px);min-height:420px;background:#fffaf0;box-shadow:0 6px 20px #5f55452b;border:1px solid #ede3d4;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}.page:before{content:'✺';position:absolute;top:16px;right:18px;color:#ddb59e;font-size:26px}.cover{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#b5826e}.cover-title{font:clamp(36px,5vw,60px) 'DM Serif Display',serif;max-width:550px}.hand{font:26px Caveat,cursive;color:#b17762}.photo{max-height:290px;max-width:96%;object-fit:contain;border:12px solid white;box-shadow:1px 8px 23px #5747352d;transform:rotate(-1.5deg)}.caption{font:28px Caveat,cursive;margin-top:18px}.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin:18px}.thumbs{display:flex;gap:9px;overflow:auto;padding:10px 0}.thumb{border:2px solid transparent;background:white;border-radius:12px;padding:5px;cursor:pointer;min-width:76px}.thumb img{width:62px;height:55px;object-fit:cover;border-radius:7px}.thumb.active{border-color:#d78268}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hint{font-size:12px;margin-top:10px;color:#8a8b7c}.empty{padding:25px;color:#8d8e84}.savebar{display:flex;gap:9px;flex-wrap:wrap}.spacer{height:10px}@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:16px;gap:20px}h1{font-size:34px}.book{padding:10px;min-height:350px}.page{min-height:330px;padding:18px}.photo{max-height:210px}header{padding:12px 16px}}@media print{header,.panel,.controls,.thumbs,.intro,.savebar{display:none!important}.wrap{display:block;padding:0}.book{box-shadow:none;background:white;padding:0}.page{width:100%;height:95vh;box-shadow:none;break-after:page}#printpages{display:block!important}#printpages .page{display:grid;margin:0;break-after:page}}#printpages{display:none}</style></head><body>
<header><div><span class="logo">✿</span><b>doodoodle <span style="font-family:Caveat;font-size:24px;color:#c77e63">journeys</span></b></div><button class="pill" onclick="window.print()">↓ Save PDF</button></header>
<main class="wrap"><section class="panel"><span class="eyebrow">Your memory studio</span><h1>Every journey has a story.</h1><p>Turn your favorite travel pictures into a keepsake worth revisiting.</p>
<label>Journal title</label><input id="title" value="Our little getaway"><label>Destination</label><input id="place" value="Somewhere wonderful"><label>Travel date</label><input id="date" value="October 2026"><label>Opening note</label><textarea id="intro">The best memories are the ones we carry home.</textarea><label>Choose paper</label><select id="theme"><option value="cream">Warm cream</option><option value="pink">Blush pink</option><option value="green">Sage green</option></select><label>Photographs</label><label class="upload" for="upload">✦ Add travel photos<small>Choose up to 20 photos from your device</small></label><input id="upload" type="file" accept="image/*" multiple><p class="hint">Photos stay on this device; they are not uploaded to a server.</p><label>Caption for current photo</label><textarea id="caption" placeholder="Write a little memory about this moment..."></textarea><div class="spacer"></div><div class="savebar"><button class="pill primary" id="save">Save project</button><button class="pill" id="load">Open saved</button><button class="pill" id="reset">New book</button></div></section>
<section class="stage"><p class="intro">Your own little corner of the world, lovingly preserved ✧</p><div class="book"><div class="page" id="page"></div></div><div class="controls"><button class="pill" id="prev">← Previous</button><span id="pagecount">1 / 1</span><button class="pill primary" id="next">Next →</button></div><div id="thumbs" class="thumbs"></div></section></main><div id="printpages"></div>
<script>
const $=id=>document.getElementById(id);let photos=[],at=0;const keys=['title','place','date','intro','theme'];const clean=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function pageHTML(n){const bg={cream:'#fffaf0',pink:'#fff0ec',green:'#f0f6ed'}[$('theme').value];let body;if(n===0){body='<div><div class="cover">A doodoodle journey</div><div style="margin:26px 0" class="cover-title">'+clean($('title').value)+'</div><div class="hand">'+clean($('place').value)+' · '+clean($('date').value)+'</div><p style="max-width:420px;margin:25px auto">'+clean($('intro').value)+'</p><div class="hand">✿ made of little moments ✿</div></div>'}else{const p=photos[n-1];body='<div><div class="cover">Memory '+n+' · '+clean($('place').value)+'</div><img class="photo" alt="Travel memory" src="'+p.src+'"><div class="caption">'+clean(p.caption||'A moment worth keeping ♡')+'</div></div>'}return '<div class="page" style="background:'+bg+'">'+body+'</div>'}
function render(){at=Math.min(at,photos.length);$('page').outerHTML=pageHTML(at).replace('class="page"','class="page" id="page"');$('pagecount').textContent=(at+1)+' / '+(photos.length+1);$('caption').disabled=at===0;$('caption').value=at?photos[at-1].caption:'';$('prev').disabled=at===0;$('next').disabled=at===photos.length;$('thumbs').innerHTML=photos.map((p,i)=>'<button class="thumb '+(at===i+1?'active':'')+'" data-i="'+(i+1)+'"><img src="'+p.src+'" alt="Photo '+(i+1)+'"></button>').join('');$('thumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>{at=+b.dataset.i;render()});$('printpages').innerHTML=Array.from({length:photos.length+1},(_,i)=>pageHTML(i)).join('')}
keys.forEach(k=>$(k).addEventListener('input',render));$('caption').oninput=()=>{if(at){photos[at-1].caption=$('caption').value;render();$('caption').focus()}};$('prev').onclick=()=>{at--;render()};$('next').onclick=()=>{at++;render()};$('upload').onchange=async(e)=>{const arr=Array.from(e.target.files).slice(0,20-photos.length);for(const f of arr){const data=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(f)});photos.push({src:data,caption:''})}if(photos.length)at=1;render();e.target.value=''};$('save').onclick=()=>{try{localStorage.setItem('doodoodle-journeys',JSON.stringify({photos,at,fields:Object.fromEntries(keys.map(k=>[k,$(k).value]))}));alert('Your project was saved in this browser.')}catch(e){alert('Unable to save: photos may exceed browser storage. Use Save PDF instead.')}};$('load').onclick=()=>{const data=localStorage.getItem('doodoodle-journeys');if(!data)return alert('No locally saved project found');try{const p=JSON.parse(data);photos=p.photos||[];at=p.at||0;keys.forEach(k=>{if(p.fields[k]!==undefined)$(k).value=p.fields[k]});render()}catch(e){alert('The saved project could not be opened')}};$('reset').onclick=()=>{if(confirm('Start a new travel book?')){photos=[];at=0;render()}};render();
</script></body></html>
